  >H&amp;S</text>

  <!-- Small gold dot top -->
  <circle cx="60" cy="6" r="2.5" fill="#C9A96E" opacity="0.6"/>
  <!-- Small gold dot bottom -->
  <circle cx="60" cy="114" r="2.5" fill="#C9A96E" opacity="0.6"/>
  <!-- Small gold dot left -->
  <circle cx="6" cy="60" r="2.5" fill="#C9A96E" opacity="0.6"/>
  <!-- Small gold dot right -->
  <circle cx="114" cy="60" r="2.5" fill="#C9A96E" opacity="0.6"/>
